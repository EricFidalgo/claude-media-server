# A throwaway Jellyfin with the plugin, the real service code and a fake Real-Debrid. Nothing here can reach the real
# Jellyfin, the real library or the real token. See run.sh.
name: rd-e2e

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    user: "1000:1000"
    ports:
      - "127.0.0.1:18096:8096"
    volumes:
      - ${E2E_DIR}/config:/config
      - ${E2E_DIR}/cache:/cache
      - ${E2E_DIR}/library/movies:/media/movies:ro
      - ${E2E_DIR}/library/shows:/media/shows:ro

  realdebrid:
    image: python:3.12-slim
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    working_dir: /app
    command: python3 -u server.py
    environment:
      RD_API_BASE: http://fake-rd:9000
      REALDEBRID_API_TOKEN: e2e-fake-token
    volumes:
      - ../service:/app:ro
      - ${E2E_DIR}/library/movies:/library/movies
      - ${E2E_DIR}/library/shows:/library/shows
      - ${E2E_DIR}/state:/state

  captions:
    build: ../../captions
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    working_dir: /app
    command: python3 -u server.py
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../../captions:/app:ro
      - ${E2E_DIR}/library/movies:/library/movies
      - ${E2E_DIR}/library/shows:/library/shows

  fake-rd:
    image: python:3.12-slim
    command: python3 -u /fake_rd.py
    volumes:
      - ./fake_rd.py:/fake_rd.py:ro
